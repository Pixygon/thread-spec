name: conformance

# The runnable proof that the fixture corpus honours the Thread spec.
#
# It installs the **published** suite rather than building a copy kept here.
# There was a copy; it fell behind the release that decides what "conformant"
# means — it read `--rendezvous` as a filename — while this repo's own docs told
# contributors to run it. An arbiter that lags the thing it arbitrates is worse
# than no arbiter, so there is one, and it comes from crates.io like everyone
# else's.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the published suite
        run: cargo install thread-conformance --locked
      - name: Corpus is CONFORMANT
        run: thread-conformance worlds/
      # A schema nobody runs drifts from the spec it claims to describe, and
      # then quietly certifies the wrong thing.
      - name: Schema matches the corpus
        run: |
          npm install --no-save ajv@8
          node -e '
            const Ajv = require("ajv/dist/2020.js").default;
            const fs = require("fs"), path = require("path");
            const ajv = new Ajv({ strict: false, allErrors: true });
            const validate = ajv.compile(JSON.parse(fs.readFileSync("schema/world-0.1.schema.json", "utf8")));
            let bad = 0;
            for (const d of fs.readdirSync("worlds")) {
              const f = path.join("worlds", d, "world.json");
              if (!fs.existsSync(f)) continue;
              if (!validate(JSON.parse(fs.readFileSync(f, "utf8")))) {
                bad++;
                console.error("✗", d, JSON.stringify(validate.errors.slice(0, 3)));
              }
            }
            if (bad) process.exit(1);
            console.log("✓ every corpus world matches the schema");
          '

      # The suite's own unit tests live with the suite, in the implementation
      # repo, and run there: github.com/Pixygon/thread-engine
